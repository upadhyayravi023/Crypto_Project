services:
  - type: web
    name: des-iot-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: des-iot-db
          property: connectionString
      - key: MQTT_ENABLED
        value: "true"
      - key: MQTT_PORT
        value: "8883"
      - key: MQTT_TLS
        value: "true"
      - key: MQTT_TOPIC_PREFIX
        value: iot
      - key: DES_KEY_B64
        sync: false
      - key: HMAC_KEY_B64
        sync: false
      - key: MQTT_HOST
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: IOT_API_TOKEN
        generateValue: true

databases:
  - name: des-iot-db
    databaseName: des_iot
    user: desiot
    plan: free
    region: oregon
